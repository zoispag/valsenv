version: 2

before:
  hooks:
    - go mod download

builds:
  - id: valsenv
    main: .
    binary: valsenv
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/zoispag/valsenv/cmd.version={{.Version}}
      - -X github.com/zoispag/valsenv/cmd.commit={{.Commit}}
      - -X github.com/zoispag/valsenv/cmd.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE

checksum:
  name_template: 'checksums.txt'

homebrew_casks:
  - name: valsenv
    binaries:
      - valsenv
    repository:
      owner: zoispag
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: Casks
    homepage: 'https://github.com/zoispag/valsenv'
    description: 'Resolve ref+ secret references in dotenv files via helmfile/vals'
    url:
      verified: 'github.com/zoispag/valsenv/'
    # Binaries are not notarized; strip the macOS quarantine attribute on install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/valsenv"]
          end
